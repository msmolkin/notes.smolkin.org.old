name: Deploy to GitHub Pages

on:
  push:
    branches:
      - hugo

jobs:
  deploy:
    runs-on: ${{ fromJSON(format(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-24.04"' || vars.STUDIO_CI_UBUNTU_20_04 || '["self-hosted","Linux","ARM64","studio-linux","studio-run-{0}"]', github.run_id)) }}
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Build Link Index
        uses: jackyzha0/hugo-obsidian@v2.20
        with:
          index: true
          input: content
          output: assets/indices
          root: .

      - name: Setup Hugo
        if: runner.os != 'Linux' || runner.arch != 'ARM64'
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.96.0'
          extended: true

      - name: Setup pinned Hugo extended on Studio Linux ARM64
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          HUGO_DIR=/opt/studio-ci/tools/hugo/0.96.0-extended-linux-arm64
          (cd "$HUGO_DIR" && sha256sum --strict --check SHA256SUMS)
          "$HUGO_DIR/hugo" version | grep -E '^hugo v0[.]96[.]0(-[0-9a-fA-F]+)?[+]extended linux/arm64([[:space:]]|$)'
          printf '%s\n' "$HUGO_DIR" >> "$GITHUB_PATH"

      - name: Build
        run: hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: master  # deploying branch
          cname: notes.smolkin.org
